</style></head><body><div id="app"></div><noscript><p>Please enable JavaScript to use these interactive exercises. 请启用 JavaScript 后使用互动练习。</p></noscript><script>const DATA={"zh": {"lang": "zh-Hans", "title": "你的每一部分，都值得被理解。", "eyebrow": "温和认识内在家庭系统（IFS）", "intro": "带着好奇与关怀，慢慢认识自己的内心。在不同声音之间，为自己留出一点选择的空间。不必着急，也没有标准答案。", "brand": "内心指南针", "nav": ["认识内在部分", "自性与八种品质", "温和练习", "内在地图", "内心巴士"], "start": "开始认识内在世界", "secondary": "做一次当下觉察", "theme": "深色模式", "light": "浅色模式", "print": "打印 / 存为 PDF", "export": "导出我的记录", "top": "回到顶部", "skip": "跳到正文", "notice": "从安全、舒适的地方开始", "safety": "本页用于心理教育与自我觉察，不能用于诊断，也不能替代心理治疗。你可以睁着眼睛、跳过问题，或随时停止。如果感到情绪淹没、恍惚，或难以感受当下，请暂停，看看周围，感受脚底或座椅的支撑。探索痛苦记忆之前，建议先与咨询师讨论。", "overview": "内心有不同声音，你依然是完整的你。", "overtext": "“一部分的我想努力完成目标，另一部分的我只想休息。”这样的内在冲突很常见。内在家庭系统（IFS）用“部分”来理解我们心中不同的情绪、冲动与观点，以及它们之间的互动。", "model": "在这个模型里，“部分”指不同的内在体验，并不意味着你有多个独立人格，也不是诊断。“自性”（Self）指一种能够稳定、慈悲地理解内在部分的能力，而不是另一个需要掌控全局的部分。", "rolehint": "点击了解不同角色。这些是帮助理解的线索，不是固定标签。同一种行为可能承担不同功能，需要结合情境来看。", "roles": [["管理者", "提前预防痛苦", "管理者是主动保护你的部分。它们努力让生活安全、可控，可能表现为计划、分析、自我批评、讨好、照顾他人，或试图掌控结果。它们常想说：“不要再经历一次了。”", "负担过重时，管理者可能觉得一切都要自己负责，害怕犯错，变得紧绷、苛刻，或难以放手。", "获得支持后，这份力量可以转化为判断力、合作、维护需要、温柔照顾、创造性解决问题，以及成长的动力。", "它想帮我避免什么？"], ["消防员", "尽快缓解痛苦", "消防员是痛苦出现后迅速行动的保护者。它们可能让你转移注意、退缩、麻木、冲动行事，或寻找立刻见效的安慰。它们常想说：“先让这种难受停下来。”", "负担过重时，寻求缓解的方式可能变得难以控制，甚至带来伤害。理解保护意图，并不等于认可有害行为。", "获得支持后，这份力量可以带来健康的自我安抚、幽默、玩心、探索、热情、勇气，以及维护重要事物的行动。", "它在努力缓解哪一种痛苦？"], ["被放逐的部分", "承载脆弱与伤痛", "这些脆弱的部分可能承载受伤、羞耻、恐惧、孤独，或未被回应的需要。有时它们仿佛很年幼，或仍停留在过去的某段经历里。它们可能在说：“请不要忘记我。”", "负担过重时，它们可能感到被拒绝、孤立、无助，担心自己的经历永远不会被听见。保护者可能竭尽全力，不让这些痛苦进入意识。", "在足够安全、得到支持的情况下，这些部分可能重新展现喜悦、好奇、温柔、开放、共情、直觉，以及与人连接的愿望。", "今天，什么能让它多一点安全感？"], ["自性", "带着关怀引领", "在 IFS 中，自性是开放、临在、有慈悲心的内在中心。它愿意为每个部分留出位置，不急着修理、评判，或赶走任何体验。", "当某个部分占据了全部注意力，我们可能很难感受到自性。这被称为“融合”，并不意味着自性消失了，也不是你做错了。", "当部分觉得自己被听见，可能愿意让出一些空间，让自性来引领。目标是彼此合作，而不是消灭任何部分。", "我能否对当下的体验多一点好奇？"]], "burden": "负担较重时", "support": "获得支持后", "qualities": "认识自性的八种品质", "qualitytext": "这些品质不是考核标准，而是可以慢慢觉察的内在资源。即使仍有不安，你也可能感受到一点好奇或关怀。", "cs": [["平静", "即使身处困难，也能感受到一点稳定。", "什么能让我稍微安定一些？"], ["清晰", "不急着评判，能够看见不止一种角度。", "慢下来后，我能看清什么？"], ["好奇", "先尝试理解，而不是预先下结论。", "如果认真倾听，我可能发现什么？"], ["慈悲", "用温暖回应痛苦，而不是催促自己改变。", "一个温柔的回应会是什么样？"], ["自信", "相信自己可以回应、学习，也可以求助。", "什么能让我相信自己可以迈出一步？"], ["勇气", "尊重自己的承受范围，靠近重要的事。", "我可以尝试哪个安全的小步骤？"], ["创造力", "为想象、表达和新的可能性留出空间。", "还有没有别的回应方式？"], ["连接感", "感到自己与内心、与他人有所连接。", "什么人或事物让我不那么孤单？"]], "psTitle": "还有五种值得留意的品质", "ps": [["耐心", "允许自己按合适的节奏前进。"], ["临在", "把注意力带回此时此刻。"], ["坚持", "在一段时间里，温和地一次次回来。"], ["视角", "记得眼前之外，还有更大的画面。"], ["玩心", "允许轻松、探索和一点趣味。"]], "notTitle": "感受自性，并不要求你……", "notText": "始终平静、完全自信、强迫自己积极，或压下愤怒与悲伤。如果你发现自己在评判某个部分，也许另一个保护者正在回应。你同样可以带着好奇，听听它的担心。", "check": "此刻的八种品质", "checktext": "从 0（此刻感受不到）到 5（此刻感受很明显），记录当下的状态。没有理想分数，不计算总分，也不用于诊断。未选择的项目会保留为空。", "unset": "尚未选择", "reflect": "这种品质对我意味着什么？", "rating": "此刻的感受程度", "radar": "此刻八种品质的自我觉察图", "checknote": "选一种你想多感受一点的品质。什么能帮助你更容易接近它？", "practice": "给内心留一点空间", "practicetext": "一个欢迎内在部分的简短练习。不必寻找记忆，也不必逼自己得到答案。可以换成你觉得自然、舒服的说法。", "steps": [["回到当下", "感受脚底或座椅的支撑，看看周围，说出几样普通物品的名称。如果关注内心让你不舒服，也可以一直把注意力放在房间里。"], ["发出邀请", "试着对自己说：“我想认识那些需要关心的部分，我们可以慢慢来。”也留意有没有部分对这个练习感到担心。"], ["商量一点空间", "试着说：“你愿意和我待在一起，而不是占据我的全部吗？如果可以，我们能否慢一点？”它不需要立刻答应，你也可以暂停。"], ["温柔地倾听", "留意念头、感受、身体感觉、词语或画面。只记下你愿意留下的内容。感谢那些出现的部分，即使你暂时没有清晰的感受。"]], "prev": "上一步", "next": "下一步", "finish": "回到第一步", "ground": "暂停，回到当下", "groundtext": "你可以先停在这里。看看周围，提醒自己身在何处，感受脚底或身体下方的支撑。说出三样你看得到的东西。也可以喝口水、轻轻活动，或联系一个信任的人。", "practiceprompt": "刚才出现了什么？一个念头、感觉、情绪，或“暂时没有感觉”，都可以。", "map": "温和地认识一个部分", "maptext": "用六个步骤（6 F’s）了解一个部分，保持你觉得舒服的距离。任何问题都可以留空。不必强行接触脆弱的部分；先倾听保护者的顾虑，把难以承受的内容留到咨询中探索。", "name": "给这个部分起个名字，或简单描述", "type": "它可能的角色", "unknown": "不确定 / 多种角色", "add": "添加一个部分", "remove": "删除这个部分", "part": "部分", "empty": "从一个小小的观察开始。准备好后，再添加一个部分。", "mapcenter": "自性", "maphint": "点击地图上的部分，可以打开对应记录。角色只是暂时的理解，不必勉强归类。", "fs": [["找到它", "我在身体哪里感受到它？出现了什么念头、词语或画面？"], ["关注它", "如果感觉舒适，我能否轻轻地把注意力放在这里？接下来注意到了什么？"], ["了解它", "它有哪些特征、感受或画面？感觉离我近还是远，年幼还是年长？“不知道”也是可以的。"], ["觉察态度", "我对它有什么感觉：好奇、关心、烦躁，还是害怕？如果另一个部分有所反应，能否先承认它也在这里？"], ["与它交朋友", "它希望我了解什么？它在承担什么职责、想保护什么？如果适合问，它感觉自己多大，又以为我多大？"], ["理解担忧", "如果不再做现在的事，它担心会发生什么？还有什么希望我理解的？需要时，随时停下来。"]], "more": "进一步了解保护者（选做）", "protector": ["这个部分出现时，身体有哪些感觉？", "我对这个部分有什么感受？", "它可能怎么看待我？它在努力为我做什么？", "我还注意到了什么？它是在预防痛苦、回应痛苦，还是承担其他任务？"], "bus": "听见每个声音，也为自己把握方向。", "bustext": "想象自性是司机，内在部分是乘客。乘客可能各有强烈的意见。练习的目的，是听见它们的需要，再选择一个有关怀的方向，而不是让谁闭嘴，或把谁赶下车。", "situation": "什么情境让我感到左右为难？", "passenger": "乘客 / 内在部分", "says": "这个部分想说什么？", "addpass": "添加一位乘客", "selfsays": "如果从更稳定、更有慈悲心的位置回应，我想对这些部分说什么？", "direction": "兼顾自身需要与承受范围，我愿意尝试的一个小步骤", "buscaption": "每位乘客都有位置，自性帮助我们选择方向。", "privacytitle": "你的记录，由你决定", "privacy": "本页不会发送你填写的内容。默认仅在当前页面中保留，除非你主动开启设备保存。打印与导出会生成由你保管的副本。请避免在共用设备上保存敏感内容。", "save": "在这台设备上保存记录", "saved": "已开启设备保存。", "memory": "未开启设备保存，关闭或刷新页面后，未保存的内容会清空。", "storagefail": "当前无法使用设备存储，请在离开前导出需要保留的记录。", "clear": "清空我的记录", "confirm": "确定清空本页全部记录、评分，以及这台设备上的已保存副本吗？", "foot": "开发：", "org": "Mind X社区", "url": "https://mindx.us/zh/", "closing": "今天不必弄懂整个内心世界。愿意多一点好奇，就是一个起点。", "exporttitle": "我的 IFS 觉察记录", "blank": "未填写", "printNote": "个人觉察记录 · 请妥善保管", "stepword": "步骤", "removeconfirm": "确定删除这个部分及其记录吗？", "removebus": "删除乘客", "rolelabel": "选择要了解的角色", "modeLabel": "查看负担较重或获得支持后的状态"}, "tw": {"lang": "zh-Hant", "title": "你的每一部分，都值得被理解。", "eyebrow": "溫和認識內在家庭系統（IFS）", "intro": "帶著好奇與關懷，慢慢認識自己的內心。在不同聲音之間，為自己留出一點選擇的空間。不必著急，也沒有標準答案。", "brand": "內心指南針", "nav": ["認識內在部分", "自性與八種品質", "溫和練習", "內在地圖", "內心巴士"], "start": "開始認識內在世界", "secondary": "做一次當下覺察", "theme": "深色模式", "light": "淺色模式", "print": "列印 / 存為 PDF", "export": "導出我的記錄", "top": "回到頂部", "skip": "跳到正文", "notice": "從安全、舒適的地方開始", "safety": "本頁用於心理教育與自我覺察，不能用於診斷，也不能替代心理治療。你可以睜著眼睛、跳過問題，或隨時停止。如果感到情緒淹沒、恍惚，或難以感受當下，請暫停，看看周圍，感受腳底或座椅的支撐。探索痛苦記憶之前，建議先與諮商師討論。", "overview": "內心有不同聲音，你依然是完整的你。", "overtext": "“一部分的我想努力完成目標，另一部分的我只想休息。”這樣的內在衝突很常見。內在家庭系統（IFS）用“部分”來理解我們心中不同的情緒、衝動與觀點，以及它們之間的互動。", "model": "在這個模型裡，“部分”指不同的內在體驗，並不意味著你有多個獨立人格，也不是診斷。“自性”（Self）指一種能夠穩定、慈悲地理解內在部分的能力，而不是另一個需要掌控全局的部分。", "rolehint": "點選了解不同角色。這些是幫助理解的線索，不是固定標籤。同一種行為可能承擔不同功能，需要結合情境來看。", "roles": [["管理者", "提前預防痛苦", "管理者是主動保護你的部分。它們努力讓生活安全、可控，可能表現為計劃、分析、自我批評、討好、照顧他人，或試圖掌控結果。它們常想說：“不要再經歷一次了。”", "負擔過重時，管理者可能覺得一切都要自己負責，害怕犯錯，變得緊繃、苛刻，或難以放手。", "獲得支持後，這份力量可以轉化為判斷力、合作、維護需要、溫柔照顧、創造性解決問題，以及成長的動力。", "它想幫我避免什麼？"], ["消防員", "盡快緩解痛苦", "消防員是痛苦出現後迅速行動的保護者。它們可能讓你轉移注意、退縮、麻木、衝動行事，或尋找立刻見效的安慰。它們常想說：“先讓這種難受停下來。”", "負擔過重時，尋求緩解的方式可能變得難以控制，甚至帶來傷害。理解保護意圖，並不等於認可有害行為。", "獲得支持後，這份力量可以帶來健康的自我安撫、幽默、玩心、探索、熱情、勇氣，以及維護重要事物的行動。", "它在努力緩解哪一種痛苦？"], ["被放逐的部分", "承載脆弱與傷痛", "這些脆弱的部分可能承載受傷、羞恥、恐懼、孤獨，或未被回應的需要。有時它們仿佛很年幼，或仍停留在過去的某段經歷裡。它們可能在說：“請不要忘記我。”", "負擔過重時，它們可能感到被拒絕、孤立、無助，擔心自己的經歷永遠不會被聽見。保護者可能竭盡全力，不讓這些痛苦進入意識。", "在足夠安全、得到支持的情況下，這些部分可能重新展現喜悅、好奇、溫柔、開放、共情、直覺，以及與人連接的願望。", "今天，什麼能讓它多一點安全感？"], ["自性", "帶著關懷引領", "在 IFS 中，自性是開放、臨在、有慈悲心的內在中心。它願意為每個部分留出位置，不急著修理、評判，或趕走任何體驗。", "當某個部分占據了全部注意力，我們可能很難感受到自性。這被稱為“融合”，並不意味著自性消失了，也不是你做錯了。", "當部分覺得自己被聽見，可能願意讓出一些空間，讓自性來引領。目標是彼此合作，而不是消滅任何部分。", "我能否對當下的體驗多一點好奇？"]], "burden": "負擔較重時", "support": "獲得支持後", "qualities": "認識自性的八種品質", "qualitytext": "這些品質不是考核標準，而是可以慢慢覺察的內在資源。即使仍有不安，你也可能感受到一點好奇或關懷。", "cs": [["平靜", "即使身處困難，也能感受到一點穩定。", "什麼能讓我稍微安定一些？"], ["清晰", "不急著評判，能夠看見不止一種角度。", "慢下來後，我能看清什麼？"], ["好奇", "先嘗試理解，而不是預先下結論。", "如果認真傾聽，我可能發現什麼？"], ["慈悲", "用溫暖回應痛苦，而不是催促自己改變。", "一個溫柔的回應會是什麼樣？"], ["自信", "相信自己可以回應、學習，也可以求助。", "什麼能讓我相信自己可以邁出一步？"], ["勇氣", "尊重自己的承受範圍，靠近重要的事。", "我可以嘗試哪個安全的小步驟？"], ["創造力", "為想象、表達和新的可能性留出空間。", "還有沒有別的回應方式？"], ["連接感", "感到自己與內心、與他人有所連接。", "什麼人或事物讓我不那麼孤單？"]], "psTitle": "還有五種值得留意的品質", "ps": [["耐心", "允許自己按合適的節奏前進。"], ["臨在", "把注意力帶回此時此刻。"], ["堅持", "在一段時間裡，溫和地一次次回來。"], ["視角", "記得眼前之外，還有更大的畫面。"], ["玩心", "允許輕鬆、探索和一點趣味。"]], "notTitle": "感受自性，並不要求你……", "notText": "始終平靜、完全自信、强迫自己積極，或壓下憤怒與悲傷。如果你發現自己在評判某個部分，也許另一個保護者正在回應。你同樣可以帶著好奇，聽聽它的擔心。", "check": "此刻的八種品質", "checktext": "從 0（此刻感受不到）到 5（此刻感受很明顯），記錄當下的狀態。沒有理想分數，不計算總分，也不用於診斷。未選擇的項目會保留為空。", "unset": "尚未選擇", "reflect": "這種品質對我意味著什麼？", "rating": "此刻的感受程度", "radar": "此刻八種品質的自我覺察圖", "checknote": "選一種你想多感受一點的品質。什麼能幫助你更容易接近它？", "practice": "給內心留一點空間", "practicetext": "一個歡迎內在部分的簡短練習。不必尋找記 function newPart(){state.parts.push({id:uid(),name:'',type:'',answers:Array(10).fill('')});renderParts();const last=$('#partlist').lastElementChild;last.open=true;last.querySelector('input').focus();persist();}

function renderParts(){renderBoard();$('#partlist').innerHTML=state.parts.length?state.parts.map((p,i)=>`<details class="partentry" id="part-${p.id}" ${i===state.parts.length-1?'open':''}><summary>${esc(p.name||L.part+' '+(i+1))}</summary><label class="field"><span>${L.name}</span><input type="text" data-pid="${p.id}" data-prop="name" value="${esc(p.name)}"></label><label class="field"><span>${L.type}</span><select data-pid="${p.id}" data-prop="type"><option value="">${L.unknown}</option>${L.roles.slice(0,3).map((r,j)=>`<option value="${j}" ${p.type===String(j)?'selected':''}>${r[0]}</option>`).join('')}</select></label>${L.fs.map((f,j)=>`<label class="field"><span>${j+1}. ${f[0]} · ${f[1]}</span><textarea rows="3" data-pid="${p.id}" data-answer="${j}">${esc(p.answers[j])}</textarea></label>`).join('')}<details><summary>${L.more}</summary>${L.protector.map((f,j)=>`<label class="field"><span>${f}</span><textarea rows="2" data-pid="${p.id}" data-answer="${j+6}">${esc(p.answers[j+6])}</textarea></label>`).join('')}</details><button class="remove" data-remove="${p.id}">${L.remove}</button></details>`).join(''):`<div class="card empty">${L.empty}</div>`;$$('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm(L.removeconfirm)){state.parts=state.parts.filter(p=>p.id!==b.dataset.remove);renderParts();persist()}});}
function renderPassengers(){$('#passengers').innerHTML=state.passengers.map((p,i)=>`<div class="passenger"><label class="field"><span>${L.passenger} ${i+1}</span><input type="text" data-bid="${p.id}" data-prop="name" value="${esc(p.name)}"></label><label class="field"><span>${L.says}</span><textarea data-bid="${p.id}" data-prop="says" rows="3">${esc(p.says)}</textarea></label><button class="remove" data-delbus="${p.id}" aria-label="${L.removebus} ${i+1}">× ${L.removebus}</button></div>`).join('');$$('[data-delbus]').forEach(b=>b.onclick=()=>{if(confirm(L.removeconfirm)){state.passengers=state.passengers.filter(p=>p.id!==b.dataset.delbus);renderPassengers();persist()}});}
function setTheme(force){let dark=force;if(dark===undefined){try{dark=localStorage.getItem('mindx-ifs-theme');dark=dark===null?matchMedia('(prefers-color-scheme: dark)').matches:dark==='dark'}catch(e){dark=matchMedia('(prefers-color-scheme: dark)').matches}}document.body.classList.toggle('dark',!!dark);$('#theme').textContent=dark?L.light:L.theme;$('#theme').setAttribute('aria-pressed',!!dark);}
function bind(){$('#theme').onclick=()=>{let d=!document.body.classList.contains('dark');setTheme(d);try{localStorage.setItem('mindx-ifs-theme',d?'dark':'light')}catch(e){}};if(isZh)$('#lang').onclick=()=>{lang=lang==='zh'?'tw':'zh';try{localStorage.setItem('mindx-ifs-script',lang)}catch(e){}render()};
$$('[data-role]').forEach(b=>{b.onclick=()=>{activeRole=+b.dataset.role;$$('[data-role]').forEach(t=>{t.setAttribute('aria-selected',t===b);t.tabIndex=t===b?0:-1});renderRole()};b.onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();let i=e.key==='Home'?0:e.key==='End'?3:(+b.dataset.role+(e.key==='ArrowRight'?1:3))%4;$('#role-tab-'+i).click();$('#role-tab-'+i).focus()}});
$$('[data-rate]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rate,v=+b.dataset.value;state.ratings[i]=state.ratings[i]===v?null:v;$$(`[data-rate="${i}"]`).forEach(t=>t.setAttribute('aria-pressed',+t.dataset.value===state.ratings[i]));$('#score'+i).textContent=state.ratings[i]===null?L.unset:state.ratings[i]+' / 5';renderChart();persist()});
$$('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;renderStep()});$('#prev').onclick=()=>{step=Math.max(0,step-1);renderStep()};$('#next').onclick=()=>{step=(step+1)%4;renderStep()};$('#ground').onclick=()=>{const p=$('#groundpanel');p.hidden=!p.hidden;$('#ground').setAttribute('aria-expanded',!p.hidden)};$('#addpart').onclick=newPart;$('#addpass').onclick=()=>{state.passengers.push({id:uid(),name:'',says:''});renderPassengers();$('#passengers').lastElementChild.querySelector('input').focus();persist()};
$('#save').onchange=e=>{saveOn=e.target.checked;if(saveOn)persist();else{try{localStorage.removeItem(KEY)}catch(e){}$('#savestatus').textContent=L.memory}};$('#clear').onclick=()=>{if(confirm(L.confirm)){state={fields:{},ratings:Array(8).fill(null),parts:[],passengers:[]};try{localStorage.removeItem(KEY)}catch(e){}saveOn=false;render()}};$('#export').onclick=exportText;$('#print').onclick=()=>window.print();$('#top').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){state.fields[t.dataset.field]=t.value;persist()}if(t.dataset.pid){let p=state.parts.find(p=>p.id===t.dataset.pid);if(t.dataset.answer!==undefined)p.answers[+t.dataset.answer]=t.value;else p[t.dataset.prop]=t.value;if(t.dataset.prop==='name'){const i=state.parts.indexOf(p);$('#part-'+p.id+'>summary').textContent=p.name||L.part+' '+(i+1);renderBoard()}persist()}if(t.dataset.bid){state.passengers.find(p=>p.id===t.dataset.bid)[t.dataset.prop]=t.value;persist()}});
function exportText(){const v=x=>x||L.blank;let a=[L.exporttitle,new Date().toLocaleString(),'',L.check];L.cs.forEach((c,i)=>a.push(c[0]+': '+(state.ratings[i]??L.unset),v(state.fields['c'+i])));a.push(L.checknote,v(state.fields.checknote),'',L.practice,v(state.fields.practiceNotes),'',L.map);state.parts.forEach((p,i)=>{a.push(p.name||L.part+' '+(i+1),L.type+': '+(p.type===''?L.unknown:L.roles[+p.type][0]));L.fs.forEach((f,j)=>a.push(f[0]+': '+f[1],v(p.answers[j])));L.protector.forEach((f,j)=>a.push(f,v(p.answers[j+6])))});a.push('',L.situation,v(state.fields.situation));state.passengers.forEach((p,i)=>a.push(p.name||L.passenger+' '+(i+1),v(p.says)));a.push(L.selfsays,v(state.fields.selfresponse),L.direction,v(state.fields.direction));const blob=new Blob([a.join('\n\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ifs-reflections-'+new Date().toISOString().slice(0,10)+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function beforePrint(){document.body.classList.add('printing');restoreDetails=$$('details').map(d=>[d,d.open]);$$('details').forEach(d=>d.open=true);$$('textarea,input[type=text],select').forEach(el=>{const d=document.createElement('div');d.className='printvalue';d.textContent=el.tagName==='SELECT'?el.selectedOptions[0].text:el.value||'________________';el.after(d)});$('#printroles').innerHTML=L.roles.map(r=>`<h3>${r[0]}</h3><p>${r[2]}</p><p><strong>${L.burden}:</strong> ${r[3]}</p><p><strong>${L.support}:</strong> ${r[4]}</p>`).join('');$('#printsteps').innerHTML=L.steps.map((s,i)=>`<h3>${i+1}. ${s[0]}</h3><p>${s[1]}</p>`).join('');}
function afterPrint(){document.body.classList.remove('printing');$$('.printvalue').forEach(e=>e.remove());restoreDetails.forEach(([d,o])=>d.open=o);$('#printroles').innerHTML='';$('#printsteps').innerHTML='';}
window.addEventListener('beforeprint',beforePrint);window.addEventListener('afterprint',afterPrint);
if(!state.passengers.length)state.passengers=[{id:uid(),name:'',says:''},{id:uid(),name:'',says:''}];render();
</script></body></html>
