ove{font-size:12px;color:var(--muted);margin-top:8px}.busshell{background:var(--warm);border:1px solid var(--line);border-radius:25px 25px 15px 15px;padding:25px;margin:25px 0 16px}.busfront{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;display:flex;align-items:center;gap:14px}.wheel{font-size:30px}.passengers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.passenger{padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}.passenger .field:first-child{margin-top:0}.buswheels{display:flex;justify-content:space-between;padding:0 35px}.buswheels span{display:block;width:45px;height:15px;background:var(--ink);border-radius:0 0 15px 15px;margin-top:-16px}.privacy{margin:50px 0 20px}.privacy p{font-size:14px}.saving{display:flex;gap:10px;align-items:center;font-size:14px}.closing{max-width:680px;text-align:center;margin:65px auto 35px;font:25px/1.6 Georgia,'Songti SC',serif}footer{text-align:center;padding:25px 20px 60px;color:var(--muted);font-size:13px}.topbtn{position:fixed;bottom:18px;right:16px;width:35px;height:35px;border-radius:50%;padding:0;z-index:15}.status{min-height:23px;font-size:13px;margin-top:8px;color:var(--muted)}.printonly{display:none}[hidden]{display:none!important}.empty{font-size:14px;color:var(--muted)}.sectionintro .hint{margin-top:12px}

</style></head><body><div id="app"></div><noscript><p>Please enable JavaScript to use these interactive exercises. 请启用 JavaScript 后使用互动练习。</p></noscript><script>const DATA={"en": {"lang": "en", "title": "All parts of you belong.", "eyebrow": "A GENTLE INTRODUCTION TO IFS", "intro": "Get to know your inner world with curiosity, care, and a little more room to choose. Explore at your own pace; there is nothing here to get perfect.", "brand": "The Inner Compass", "nav": ["Understand", "Self & the 8 C’s", "Practice", "Parts map", "Your bus"], "start": "Explore your inner world", "secondary": "Try a check-in", "theme": "Dark mode", "light": "Light mode", "print": "Print / PDF", "export": "Export reflections", "top": "Back to top", "skip": "Skip to content", "notice": "A gentle starting point", "safety": "These exercises offer education and reflection, not diagnosis or a replacement for therapy. You can keep your eyes open, skip any prompt, or stop. If you feel flooded, disconnected, or less present, pause and look around the room. Feel the support beneath you. Work with your therapist before exploring painful memories.", "overview": "Many parts. One whole person.", "overtext": "“Part of me wants to reach my goal. Another part wants to rest.” Inner conflict is a common human experience. Internal Family Systems (IFS) offers a way to understand these different feelings, impulses, and viewpoints as parts of an internal system.", "model": "In this model, parts are aspects of experience—not separate people or a diagnosis. Self is understood as a compassionate, steady capacity to relate to parts, rather than another part to control them.", "rolehint": "Choose a role to explore. These are flexible patterns, not labels you have to fit. A behavior’s function and context matter more than its name.", "roles": [["Managers", "Prevent pain", "Proactive protectors try to keep life safe and predictable. They may plan, analyze, criticize, please others, caretake, or try to control outcomes. Their message is often: “Never again.”", "When carrying a heavy load, a manager may feel responsible for everything, fear mistakes, or become rigid and demanding.", "With support, this energy can become discernment, cooperation, advocacy, nurturing, creative problem-solving, and growth.", "What is this part trying to prevent?"], ["Firefighters", "Stop pain now", "Reactive protectors rush in when distress rises. They may distract, withdraw, numb, act impulsively, or seek fast relief. Their message is often: “Whatever it takes to make this stop.”", "When carrying a heavy load, relief-seeking may become compulsive or harmful. Understanding the protective intention does not mean endorsing harmful actions.", "With support, this energy can offer healthy soothing, humor, play, adventure, passion, courage, and standing up for what matters.", "What pain is this part trying to soothe?"], ["Exiles", "Carry vulnerable feelings", "Vulnerable parts may hold hurt, shame, fear, loneliness, or unmet needs. They can feel young or stuck in an earlier experience. Their message may be: “Please don’t forget me.”", "When carrying a heavy load, a vulnerable part may feel rejected, isolated, overwhelmed, or afraid its story will never be heard. Protectors may work hard to keep its pain out of awareness.", "With enough safety and support, this energy can reconnect with joy, curiosity, tenderness, openness, empathy, intuition, and connection.", "What would help this part feel safer today?"], ["Self", "Lead with care", "Self is the open-hearted, present center in the IFS model. It makes room for every part and can listen without rushing to fix, judge, or push anything away.", "Self may feel harder to access when a part takes over attention. This is sometimes called blending; it does not mean Self is gone or that you have failed.", "As parts feel heard, they may allow more space for Self to lead. The aim is collaboration, not getting rid of parts.", "Can I bring even a little curiosity to what is here?"]], "burden": "Under strain", "support": "With support", "qualities": "Meet the qualities of Self", "qualitytext": "The 8 C’s are qualities to notice, not standards to achieve. You can feel a small amount of one quality while other feelings are present.", "cs": [["Calm", "A little steadiness, even when things are difficult.", "What helps me feel a little more settled?"], ["Clarity", "Seeing more than one viewpoint, with less urgency to judge.", "What can I see more clearly if I slow down?"], ["Curiosity", "Wanting to understand without deciding in advance.", "What might I learn if I listen?"], ["Compassion", "Meeting suffering with warmth rather than pressure to fix it.", "What would a kind response sound like?"], ["Confidence", "Trusting that I can respond, learn, and ask for help.", "What helps me trust my ability to take one step?"], ["Courage", "Approaching what matters while respecting my limits.", "What is one small, safe step I could take?"], ["Creativity", "Making room for imagination, expression, and new possibilities.", "Is there another way to respond?"], ["Connectedness", "Feeling a sense of belonging to myself and others.", "Who or what helps me feel less alone?"]], "psTitle": "Five more ways to recognize Self", "ps": [["Patience", "Allow your own pace."], ["Presence", "Return to this moment."], ["Persistence", "Come back gently over time."], ["Perspective", "Remember the wider picture."], ["Playfulness", "Make room for lightness."]], "notTitle": "Self does not require…", "notText": "Constant calm, perfect confidence, forced positivity, or suppressing anger and sadness. If you notice judgment toward a part, another protective part may be present. You can get curious about that response too.", "check": "Your 8 C’s check-in", "checktext": "Rate what feels available right now, from 0 (not available) to 5 (strongly available). There is no ideal score, total, or diagnostic meaning. Unset ratings stay blank.", "unset": "Not rated", "reflect": "What does this quality mean to you?", "rating": "Availability", "radar": "Your current ratings for the eight qualities", "checknote": "Notice one quality you would like to invite in. What might make it a little more accessible?", "practice": "Make a little room inside", "practicetext": "A brief “all parts are welcome” practice. You do not need to search for a memory or force an answer. Use words that feel comfortable to you.", "steps": [["Arrive", "Notice your feet or the chair supporting you. Look around and name a few ordinary objects. You can stay focused on the room if turning inward feels uncomfortable."], ["Offer an invitation", "Try: “I want to understand the parts of me that need care. We can take our time.” Notice whether any part has concerns about this exercise."], ["Ask for a little space", "Try: “Could you be here with me without taking over? If that feels possible, can we slow down a little?” A part does not have to agree. You can pause."], ["Listen gently", "Notice thoughts, feelings, body sensations, words, or images. Write only what you want to remember. Thank the parts that showed up, even if nothing felt clear."]], "prev": "Previous", "next": "Next", "finish": "Return to the beginning", "ground": "Pause & ground", "groundtext": "You can stop here. Look around, notice where you are, and feel your feet or the surface beneath you. Name three things you can see. Choose what helps: a sip of water, gentle movement, or reaching out to someone you trust.", "practiceprompt": "What showed up? A thought, sensation, feeling, or simply “nothing yet” is enough.", "map": "Meet a part, gently", "maptext": "Use the 6 F’s to get to know a part at a comfortable distance. You can leave anything blank. Do not force contact with a vulnerable part; listen to protectors’ concerns and bring difficult material to therapy.", "name": "A name or description for this part", "type": "Possible role", "unknown": "Not sure / mixed", "add": "Add another part", "remove": "Remove this part", "part": "Part", "empty": "Your map starts with one small observation. Add a part when you feel ready.", "mapcenter": "Self", "maphint": "Select a part on your map to open its reflection. Roles are tentative; parts may not fit one category.", "fs": [["Find", "Where do I notice it in my body? What thoughts, words, or images appear?"], ["Focus", "If it feels comfortable, can I gently give this experience some attention? What emerges?"], ["Flesh out", "What qualities, feelings, or images do I notice? Does the part seem near or far, young or older? “I don’t know” is welcome."], ["Feel toward", "How do I feel toward this part? Curious, caring, irritated, afraid? If another part reacts, can I acknowledge it before continuing?"], ["Befriend", "What does this part want me to know about its role or purpose? How old does it seem, and how old does it think I am, if that makes sense to ask?"], ["Fears", "What does it fear would happen if it stopped doing its job? Is there anything else it wants me to understand? Stop whenever you need to."]], "more": "A few optional protector questions", "protector": ["What bodily sensations accompany this part?", "How do I feel about this part?", "How might it feel about me, and what does it try to do for me?", "What else do I notice? Does it try to prevent pain, respond to pain, or something else?"], "bus": "You can listen without handing over the wheel.", "bustext": "Imagine Self as the driver and parts as passengers. Passengers can have strong opinions. The goal is to hear their needs while choosing a caring direction—not to silence or eject anyone.", "situation": "A situation where I feel pulled in different directions", "passenger": "Passenger / part", "says": "What this part wants to say", "addpass": "Add a passenger", "selfsays": "From a steadier, more compassionate place, what would I like to say to these parts?", "direction": "One small next step that respects my needs and limits", "buscaption": "All passengers belong. Self helps choose the direction.", "privacytitle": "Your reflections, your choice", "privacy": "Your entries are not sent anywhere by this page. They stay in memory unless you turn on device saving. Printing and exporting create copies you control. Avoid saving sensitive reflections on a shared device.", "save": "Save reflections on this device", "saved": "Device saving is on.", "memory": "Device saving is off. Closing or reloading clears unsaved entries.", "storagefail": "Device storage is unavailable. Export reflections before leaving.", "clear": "Clear reflections", "confirm": "Clear every reflection and rating on this page and remove the saved copy from this device?", "foot": "Developed by", "org": "Mind X Associates", "url": "https://mindx.us/", "closing": "You do not have to figure out your whole inner world today. One moment of curiosity is a place to begin.", "exporttitle": "My IFS reflections", "blank": "Not entered", "printNote": "Personal reflections • Keep this copy somewhere private", "stepword": "Step", "removeconfirm": "Remove this part and its notes?", "removebus": "Remove passenger", "rolelabel": "Explore a role", "modeLabel": "View role under strain or with support"}};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const isZh=!!DATA.zh;let lang=isZh?'zh':'en',L=DATA[lang],activeRole=0,supported=false,step=0,saveOn=false,restoreDetails=[];
const KEY='mindx-ifs-reflections-v1'+(isZh?'-zh':'-en');let state={fields:{},ratings:Array(8).fill(null),parts:[],passengers:[]};
try{let old=localStorage.getItem(KEY);if(old){state=JSON.parse(old);saveOn=true;}if(isZh)lang=localStorage.getItem('mindx-ifs-script')==='tw'?'tw':'zh';}catch(e){}
L=DATA[lang];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(label,id,value='',rows=3){return `<label class="field"><span>${esc(label)}</span><textarea id="${id}" data-field="${id}" rows="${rows}">${esc(value)}</textarea></label>`}
function persist(){if(saveOn){try{localStorage.setItem(KEY,JSON.stringify(state));$('#savestatus').textContent=L.saved;}catch(e){$('#savestatus').textContent=L.storagefail;}}}

function $(s,r){return (r||document).querySelector(s)}
function fmt(t,o){return t.replace(/\{(\w+)\}/g,function(m,k){return o[k]!=null?o[k]:m})}
function accent(){var m=document.querySelector('meta[name="theme-color"]');var c=m&&m.getAttribute("content");if(c&&/^#[0-9a-f]{6}$/i.test(c))document.documentElement.style.setProperty("--gj-accent",c)}
function confetti(n){if(!PLAYFUL)return;try{if(typeof matchMedia!=="undefined"&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var c=document.createElement("canvas");c.id="gj-confetti";document.body.appendChild(c);var x=c.getContext("2d");if(!x){c.remove();return}c.width=innerWidth;c.height=innerHeight;var cols=["#a9c7b4","#e6b86a","#cbc4e7","#d98d82","#8fd0b8"];var ps=[];for(var i=0;i<(n||70);i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,w:6+Math.random()*7,h:8+Math.random()*9,vy:2.2+Math.random()*3.2,vx:-1.4+Math.random()*2.8,r:Math.random()*3.14,vr:-.12+Math.random()*.24,col:cols[i%cols.length]});var t0=performance.now();(function frame(t){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.y+=p.vy;p.x+=p.vx;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(t-t0<2400)requestAnimationFrame(frame);else{c.remove()}})(t0)}catch(e){}}
function stopTitle(el){var h=el.querySelector("h2,h3");var t=h?h.textContent.trim():"";return t.length>64?t.slice(0,64)+"…":t}
function findStops(){
  var main=document.querySelector("main")||document.body;
  var els=[].slice.call(main.querySelectorAll(":scope > section"));
  if(els.length<3){var all=[].slice.call(main.querySelectorAll("section")).filter(function(el){return !el.parentElement.closest("section")});if(all.length>els.length)els=all}
  return els.filter(function(el){
    if(el.id==="gj-banner")return false;
    if(el.hasAttribute("hidden"))return false;
    var cls=(el.className||"").toString();
    if(/hero|print|modal/i.test(cls))return false;
    if(el.querySelector("h1")&&!el.querySelector("h2,h3"))return false;
    try{var cs=getComputedStyle(el);if(cs.display==="none"||cs.visibility==="hidden")return false}catch(e){}
    return true;
  });
}
function level(){return Math.min(S.levelTitles.length,1+Math.floor(state.xp/120))}
function pct(){return stops.length?Math.round(state.explored.length/stops.length*100):0}
function renderHUD(){
  if(!els.banner)return;
  var done=state.explored.length,total=stops.length;
  els.fill.style.width=pct()+"%";
  els.progress.textContent=fmt(S.progress,{done:done,total:total});
  if(PLAYFUL){els.xp.textContent="✦ "+state.xp+" XP · "+S.level+" "+level()+" · "+S.levelTitles[level()-1];els.pill.textContent="✦ "+pct()+"% · "+state.xp+" XP"}
  else{els.pill.textContent=pct()+"% · "+done+"/"+total}
  var half=total&&done>=Math.ceil(total/2), full=total&&done===total;
  els.badges.innerHTML=[["first",done>=1],["half",half],["full",full]].map(function(b){return '<span class="gj-badge '+(b[1]?"":"locked")+'">'+(b[1]?"✓ ":"")+S.badges[b[0]]+"</span>"}).join("");
  els.complete.style.display=full?"block":"none";
  stops.forEach(function(st){var b=st.el.querySelector(":scope > .gj-chip .gj-mark")||st.el.querySelector(".gj-chip .gj-mark");if(b){var on=state.explored.indexOf(st.id)>-1;b.classList.toggle("done",on);b.textContent=on?S.marked:S.mark}});
}
function award(key,amt){if(state.bonuses[key])return;state.bonuses[key]=1;state.xp+=amt}
function checkMilestones(){
  var done=state.explored.length,total=stops.length;if(!total)return;
  if(done>=Math.ceil(total/2))award("half",30);
  if(done===total){award("full",50);confetti(90)}
  save();renderHUD();
}
function markStop(id,on){
  var i=state.explored.indexOf(id);
  if(on&&i<0){state.explored.push(id);if(PLAYFUL||true)award("stop:"+id,20)}
  if(!on&&i>-1){state.explored.splice(i,1)}
  save();renderHUD();checkMilestones();
}
function buildStops(){
  stops=findStops().map(function(el,i){var id=el.id||("gj-stop-"+(i+1));el.classList.add("gj-stop");return {el:el,id:id}});
  stops.forEach(function(st,i){
    if(st.el.querySelector(".gj-chip"))return;
    var chip=document.createElement("div");chip.className="gj-chip";
    chip.innerHTML='<span><span class="gj-stop-label">'+fmt(S.stopLabel,{n:i+1,total:stops.length})+'</span> <span class="gj-stop-title">'+stopTitle(st.el).replace(/</g,"&lt;")+'</span>'+(PLAYFUL?' <span class="gj-stop-title">'+S.xpPer+'</span>':"")+'</span>';
    var b=document.createElement("button");b.type="button";b.className="gj-mark";b.textContent=S.mark;
    b.addEventListener("click",function(){markStop(st.id,state.explored.indexOf(st.id)<0)});
    chip.appendChild(b);st.el.insertBefore(chip,st.el.firstChild);
  });
}
function scrollToEl(el){try{var y=el.getBoundingClientRect().top+window.scrollY-14;window.scrollTo({top:y,behavior:"smooth"})}catch(e){try{el.scrollIntoView()}catch(_){}}}
function setCurrent(i){
  state.current=Math.max(0,Math.min(stops.length-1,i));
  stops.forEach(function(st,j){st.el.classList.toggle("gj-current",j===state.current)});
  var nav=els.focusnav;if(nav){nav.querySelector(".gj-dots").innerHTML=stops.map(function(st,j){return '<button type="button" class="gj-dot'+(j===state.current?" now":"")+(state.explored.indexOf(st.id)>-1?" seen":"")+'" data-i="'+j+'" aria-label="'+(j+1)+'"></button>'}).join("");
  nav.querySelector(".gj-next").textContent=state.current>=stops.length-1?S.finish:S.next}
  scrollToEl(stops[state.current].el);
}
function enterFocus(at){
  if(!stops.length)return;state.focus=true;document.body.classList.add("gj-focus");
  var start=at!=null?at:stops.findIndex(function(st){return state.explored.indexOf(st.id)<0});
  setCurrent(start<0?stops.length-1:start);
}
function exitFocus(){state.focus=false;document.body.classList.remove("gj-focus");stops.forEach(function(st){st.el.classList.remove("gj-current")})}
function buildUI(){
  var main=document.querySelector("main")||document.body;
  var banner=document.createElement("section");banner.className="gj-banner";banner.id="gj-banner";
  banner.innerHTML='<h2>'+S.bannerTitle+'</h2><p>'+S.bannerSub+'</p><div class="gj-bar"><i></i></div><div class="gj-stats"><span class="gj-progress"></span>'+(PLAYFUL?'<span class="gj-xp"></span>':"")+'</div><div class="gj-actions"><button type="button" class="gj-btn gj-resume">'+S.resume+'</button><button type="button" class="gj-btn ghost gj-focusbtn">'+S.focusOn+'</button></div><div class="gj-badges"></div><div class="gj-complete" style="display:none">'+S.completeMsg+'</div>';
  try{if(stops.length&&stops[0].el.parentNode)stops[0].el.parentNode.insertBefore(banner,stops[0].el);else main.insertBefore(banner,main.firstChild)}catch(e){main.insertBefore(banner,main.firstChild)}
  var pill=document.createElement("button");pill.type="button";pill.className="gj-pill";pill.addEventListener("click",function(){scrollToEl(banner)});
  document.body.appendChild(pill);
  var nav=document.createElement("div");nav.className="gj-focusnav";
  nav.innerHTML='<button type="button" class="gj-exit">'+S.focusOff+'</button><button type="button" class="gj-prev">'+S.prev+'</button><span class="gj-dots"></span><button type="button" class="gj-next">'+S.next+'</button>';
  document.body.appendChild(nav);
  els={banner:banner,fill:banner.querySelector(".gj-bar i"),progress:banner.querySelector(".gj-progress"),xp:banner.querySelector(".gj-xp"),badges:banner.querySelector(".gj-badges"),complete:banner.querySelector(".gj-complete"),pill:pill,focusnav:nav};
  banner.querySelector(".gj-resume").addEventListener("click",function(){var i=stops.findIndex(function(st){return state.explored.indexOf(st.id)<0});scrollToEl(i>-1?stops[i].el:banner)});
  banner.querySelector(".gj-focusbtn").addEventListener("click",function(){enterFocus()});
  nav.querySelector(".gj-exit").addEventListener("click",exitFocus);
  nav.querySelector(".gj-prev").addEventListener("click",function(){setCurrent(state.current-1)});
  nav.querySelector(".gj-next").addEventListener("click",function(){var st=stops[state.current];if(st)markStop(st.id,true);if(state.current>=stops.length-1){exitFocus();scrollToEl(banner)}else setCurrent(state.current+1)});
  nav.querySelector(".gj-dots").addEventListener("click",function(e){var d=e.target.closest(".gj-dot");if(d)setCurrent(+d.dataset.i)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.focus)exitFocus()});
}
var inited=false;
function init(){
  if(inited)return;
  buildStops();
  if(stops.length<3){stops=[];return}
  accent();buildUI();renderHUD();inited=true;
  var main=document.querySelector("main");
  if(main&&typeof MutationObserver!=="undefined"){
    var t;var ob=new MutationObserver(function(){if(state.focus)return;clearTimeout(t);t=setTimeout(function(){var before=stops.length;buildStops();if(stops.length!==before){var b=els.banner;if(b&&stops[0]&&stops[0].el.parentNode)try{stops[0].el.parentNode.insertBefore(b,stops[0].el)}catch(e){}renderHUD()}},450)});
    ob.observe(main,{childList:true,subtree:false});
    setTimeout(function(){ob.disconnect()},15000);
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){init()});else init();
[700,1800,3500].forEach(function(ms){setTimeout(init,ms)});
})();

</script>
</body></html>
